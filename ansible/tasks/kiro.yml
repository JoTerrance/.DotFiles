- name: Fetch Kiro release metadata
  ansible.builtin.uri:
    url: https://prod.download.desktop.kiro.dev/stable/metadata-linux-x64-stable.json
    return_content: true
  register: kiro_metadata

- name: Download Kiro .deb package
  ansible.builtin.get_url:
    url: "https://prod.download.desktop.kiro.dev/releases/stable/linux-x64/signed/{{kiro_metadata.json.currentRelease}}/deb/kiro-ide-{{kiro_metadata.json.currentRelease}}-stable-linux-x64.deb"
    dest: /tmp/kiro-latest.deb
    mode: '0644'
  become: false

- name: Install Kiro
  ansible.builtin.apt:
    deb: /tmp/kiro-latest.deb
    state: present
  become: true
  environment:
    PATH: "/usr/local/sbin:/usr/sbin:/sbin:{{ ansible_env.PATH | default('/usr/local/bin:/usr/bin:/bin') }}"

- name: Clean up Kiro .deb package
  ansible.builtin.file:
    path: /tmp/kiro-latest.deb
    state: absent
