- name: Include shared zsh setup
  include_tasks: zsh-core.yml

- name: mycli config folder
  file: 
    path: ~/.config/mycli/  
    state: directory 
    mode: '0755'
  ignore_errors: yes

- name: pgcli config folder
  file: 
    path: ~/.config/pgcli/  
    state: directory 
    mode: '0755'
  ignore_errors: yes

- name: litecli config folder
  file: 
    path: ~/.config/litecli/  
    state: directory 
    mode: '0755'
  ignore_errors: yes

- name: mssql config folder
  file: 
    path: ~/.config/mssqlcli/  
    state: directory 
    mode: '0755'
  ignore_errors: yes

- name: iredis config folder
  file: 
    path: ~/.config/iredis/  
    state: directory 
    mode: '0755'
  ignore_errors: yes

- name: mycli symlink
  file: 
    src: ~/.DotFiles/mycli/config 
    dest: ~/.myclirc  
    state: link 
    force: yes

- name: pgcli symlink
  file: 
    src: ~/.DotFiles/pgcli/config
    dest: ~/.config/pgcli/config
    state: link 
    force: yes

- name: litecli symlink
  file: 
    src: ~/.DotFiles/litecli/config 
    dest:   ~/.config/litecli/config
    state: link 
    force: yes

- name: mssql symlink
  file: 
    src: ~/.DotFiles/mssqlcli/config
    dest:  ~/.config/mssqlcli/config 
    state: link 
    force: yes

- name: iredis symlink
  file: 
    src: ~/.DotFiles/iredis/.iredisrc 
    dest:  ~/.iredisrc 
    state: link 
    force: yes

- name: change shell to zsh for current user
  user:
    name: "{{ ansible_user_id }}"
    shell: /usr/bin/zsh
  become: true
